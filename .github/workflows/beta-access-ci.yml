name: WEmulDroid Beta Access integration checks
on:
  pull_request:
    paths:
      - 'src/BetaAccess.ps1'
      - 'src/BetaUpload.ps1'
      - 'src/Lab.ps1'
      - 'installer/Build-Windows.ps1'
      - 'installer/WEmulDroid.iss'
      - 'docs/BETA_ACCESS_INTEGRATION.md'
      - '.github/workflows/beta-access-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/BetaAccess.ps1'
      - 'src/BetaUpload.ps1'
      - 'src/Lab.ps1'
      - 'installer/Build-Windows.ps1'
      - 'installer/WEmulDroid.iss'
      - 'docs/BETA_ACCESS_INTEGRATION.md'
      - '.github/workflows/beta-access-ci.yml'
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('src/BetaAccess.ps1','src/BetaUpload.ps1','src/Lab.ps1','installer/Build-Windows.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ('Parser failed: ' + $file + ' ' + ($errors | Out-String)) }
          }
          . .\src\BetaAccess.ps1
          $state = Get-WEmulDroidBetaContext (Resolve-Path .).Path
          if ($state.Enabled -or -not $state.Allowed) { throw 'Normal installer unexpectedly gated' }
