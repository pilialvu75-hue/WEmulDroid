name: PowerShell syntax (lightweight)

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.ps1"
      - "tests/**/*.ps1"
      - "*.cmd"
      - "VERSION.txt"
      - ".github/workflows/syntax.yml"
  pull_request:
    paths:
      - "src/**/*.ps1"
      - "tests/**/*.ps1"
      - "*.cmd"
      - ".github/workflows/syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allErrors = @()
          $files = Get-ChildItem -Path src -Filter '*.ps1' -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($file.Name):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
                $allErrors += $parseError
              }
            } else {
              Write-Host "PARSE OK: $($file.Name)"
            }
          }
          if ($files.Count -lt 2 -or $allErrors.Count -gt 0) {
            throw 'PowerShell syntax check failed.'
          }
      - name: Run APK offline validation tests
        shell: pwsh
        run: |
          ./tests/ApkSafety.Tests.ps1
          ./tests/Snapshots.Tests.ps1
          ./tests/Localization.Tests.ps1
          ./tests/Updates.Tests.ps1
          ./tests/AdbStartup.Tests.ps1
      - name: Guard independent project boundary and required entrypoints
        shell: bash
        run: |
          set -euo pipefail
          for f in Verifica-PC.cmd Installa-Android.cmd Prova-Android.cmd Avvia-Android.cmd Installa-PlayStore.cmd Avvia-PlayStore.cmd src/Check-Requirements.ps1 src/Setup-Android.ps1 src/Test-Android.ps1 src/Lab.ps1 src/ApkInstall.ps1 src/WindowMode.ps1 src/Snapshots.ps1 src/Diagnostics.ps1 src/Localization.ps1 src/Updates.ps1 src/UpdateDialog.ps1 src/Apply-Update.ps1 src/AdbProcess.ps1 src/Layout.ps1 src/GuestControls.ps1 src/ScreenProfiles.ps1; do
            test -s "$f" || { echo "::error::Missing file $f"; exit 1; }
          done
          if grep -RniE 'Ai-orchestrator-riserva|com[.]aiorchestrator|Test-AiOrchestrator|AivexusAndroidLab|Aivexus_API_35' src --include='*.ps1'; then
            echo "::error::Forbidden dependency or legacy naming in runtime code."
            exit 1
          fi
          echo 'Independent project boundaries: PASS'
          grep -Fq 'Fullscreen' src/Lab.ps1
          grep -Fq 'Install-VerifiedApk' src/Lab.ps1
          grep -Fq 'Get-RemoteApk' src/Lab.ps1
          grep -Fq 'Touchpad + mouse (futuro)' src/Lab.ps1
          grep -Fq 'Invoke-WEmulDroidSnapshot' src/Lab.ps1
          grep -Fq 'Collect-WEmulDroidDiagnostics' src/Lab.ps1
          grep -Fq 'Update-WEmulDroidLanguage' src/Lab.ps1
          grep -Fq 'Initialize-WEmulDroidLayout' src/Lab.ps1
          grep -Fq 'Start-WEmulDroidQuietEmulator' src/Lab.ps1
          grep -Fq 'Start-WEmulDroidAutoCenter' src/Lab.ps1
          grep -Fq 'Set-WEmulDroidWindowCentered' src/WindowMode.ps1
          grep -Fq 'Get-WEmulDroidScreenProfile' src/Lab.ps1
          grep -Fq 'Show-WEmulDroidUpdateSettings' src/Lab.ps1
          grep -Fq 'Invoke-WEmulDroidNative' src/Lab.ps1
          test -s VERSION.txt
      - name: Check Google Play profile separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "system-images;android-35;google_apis_playstore;x86_64" src/Setup-Android.ps1
          grep -Fq "WEmulDroid_Play_API_35" src/Setup-Android.ps1
          grep -Fq "WEmulDroid_API_35" src/Setup-Android.ps1
          grep -Fq -- "-PlayStore" Installa-PlayStore.cmd
          grep -Fq -- "-AvdName" Avvia-PlayStore.cmd
          grep -Fq "pm path com.android.vending" src/Lab.ps1
          test -s docs/GOOGLE_PLAY.md
          echo "Google Play and standard profiles are separate: PASS"
