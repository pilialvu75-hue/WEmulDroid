name: Beta Access pilot checks
on:
  pull_request:
    paths:
      - 'beta-access/**'
      - 'src/BetaAccess.ps1'
      - 'src/BetaUpload.ps1'
      - 'src/Lab.ps1'
      - 'installer/Build-Windows.ps1'
      - '.github/workflows/beta-access-ci.yml'
  push:
    branches: [main]
    paths:
      - 'beta-access/**'
      - 'src/BetaAccess.ps1'
      - 'src/BetaUpload.ps1'
      - 'src/Lab.ps1'
      - 'installer/Build-Windows.ps1'
      - '.github/workflows/beta-access-ci.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beta-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('src/BetaAccess.ps1','src/BetaUpload.ps1','src/Lab.ps1','installer/Build-Windows.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ('Parser failed: ' + $file + ' ' + ($errors | Out-String)) }
          }
          . .\src\BetaAccess.ps1
          $state = Get-WEmulDroidBetaContext (Resolve-Path .).Path
          if ($state.Enabled -or -not $state.Allowed) { throw 'Normal install unexpectedly gated' }
