name: Publish trusted WEmulDroid installer (signed only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require CA-issued signing credentials
        shell: powershell
        env:
          WEMULDROID_PFX_BASE64: ${{ secrets.WEMULDROID_PFX_BASE64 }}
          WEMULDROID_PFX_PASSWORD: ${{ secrets.WEMULDROID_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEMULDROID_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WEMULDROID_PFX_PASSWORD)) {
            throw 'Trusted publisher certificate not configured. Release is blocked.'
          }
      - name: Test version detection and ADB on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\tests\Updates.Tests.ps1
          .\tests\InstallerUpdates.Tests.ps1
          .\tests\UpdateDialogDiagnostics.Tests.ps1
          .\tests\AdbStartup.Tests.ps1
          .\tests\Localization.Tests.ps1
          .\tests\Layout.Tests.ps1
          .\tests\GuestControls.Tests.ps1
          .\tests\SetupAndKeyboard.Tests.ps1
          .\tests\WindowCenter.Tests.ps1
          .\tests\ScreenProfiles.Tests.ps1
          .\tests\WindowFit.Tests.ps1
          .\tests\GameDisplaySafety.Tests.ps1
      - name: Prepare Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build only with trusted publisher signatures
        shell: powershell
        env:
          WEMULDROID_PFX_BASE64: ${{ secrets.WEMULDROID_PFX_BASE64 }}
          WEMULDROID_PFX_PASSWORD: ${{ secrets.WEMULDROID_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          .\installer\Build-Windows.ps1 -Signed
          $version=(Get-Content VERSION.txt -Raw).Trim()
          $setup=Join-Path (Resolve-Path '.\dist\payload\Output').Path ("WEmulDroid-Setup-$version.exe")
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'Valid') { throw 'Unsigned installer' }
          $setupSignature=Get-AuthenticodeSignature -LiteralPath $setup
          $launcherSignature=Get-AuthenticodeSignature -LiteralPath '.\dist\payload\WEmulDroid.exe'
          if (-not $setupSignature.SignerCertificate -or -not $launcherSignature.SignerCertificate -or
              $setupSignature.SignerCertificate.Thumbprint -ne $launcherSignature.SignerCertificate.Thumbprint) {
            throw 'Setup and launcher must have the same trusted signing certificate'
          }
          if ((Get-AuthenticodeSignature -LiteralPath '.\dist\payload\WEmulDroid.exe').Status -ne 'Valid') { throw 'Unsigned launcher' }
          foreach ($ps1 in (Get-ChildItem '.\dist\payload\src\*.ps1')) {
            if ((Get-AuthenticodeSignature -LiteralPath $ps1.FullName).Status -ne 'Valid') { throw "Unsigned script $($ps1.Name)" }
          }
      - name: Test signed install, desktop shortcut and signed uninstaller
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content VERSION.txt -Raw).Trim()
          $setup=Join-Path (Resolve-Path '.\dist\payload\Output').Path ("WEmulDroid-Setup-$version.exe")
          $proc=Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw 'Signed installer failed' }
          $app=Join-Path $env:LOCALAPPDATA 'Programs\WEmulDroid'
          $desktop=Join-Path ([Environment]::GetFolderPath('Desktop')) 'WEmulDroid.lnk'
          if (-not (Test-Path $desktop)) { throw 'Desktop shortcut missing' }
          $uninstall=Get-ChildItem -LiteralPath $app -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstall -or (Get-AuthenticodeSignature -LiteralPath $uninstall.FullName).Status -ne 'Valid') { throw 'Uninstaller not signed' }
          $setupSigner=(Get-AuthenticodeSignature -LiteralPath $setup).SignerCertificate
          $uninstallSigner=(Get-AuthenticodeSignature -LiteralPath $uninstall.FullName).SignerCertificate
          if (-not $setupSigner -or -not $uninstallSigner -or
              $setupSigner.Thumbprint -ne $uninstallSigner.Thumbprint) {
            throw 'Uninstaller publisher identity differs from signed setup'
          }
          Write-Host 'Signed installer, shortcuts and uninstaller passed.'
      - name: Release official signed EXE to GitHub
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content VERSION.txt -Raw).Trim()
          $setup=Join-Path (Resolve-Path '.\dist\payload\Output').Path ("WEmulDroid-Setup-$version.exe")
          gh release view $version --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists: refusing overwrite' }
          $args=@('release','create',$version,$setup,("$setup.sha256"),'--repo',$env:GITHUB_REPOSITORY,'--title',"WEmulDroid $version signed Windows installer",'--notes','CA-signed setup, launcher, scripts and uninstaller. Desktop icon and user-approved updates. Windows automated installation validated. Android boot requires physical ASUS test.')
          if ($version -match '-(?:beta|rc)\.') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
