name: PowerShell syntax (lightweight)

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.ps1"
      - ".github/workflows/syntax.yml"
  pull_request:
    paths:
      - "src/**/*.ps1"
      - ".github/workflows/syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allErrors = @()
          $files = Get-ChildItem -Path src -Filter '*.ps1' -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($file.Name):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
                $allErrors += $parseError
              }
            } else {
              Write-Host "PARSE OK: $($file.Name)"
            }
          }
          if ($files.Count -lt 2 -or $allErrors.Count -gt 0) {
            throw 'PowerShell syntax check failed.'
          }
